<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="antarcticSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#312e81" />
      <stop offset="70%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0" />
      <stop offset="50%" stop-color="#4ade80" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="packIce" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
    <linearGradient id="goldenEar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
  </defs>

  <!-- Twilight Polar Sky with Soft Aurora Borealis glow -->
  <rect width="800" height="500" fill="url(#antarcticSky)" />
  <path d="M 0,120 Q 300,50 500,100 T 800,80 L 800,200 L 0,200 Z" fill="url(#aurora)" />

  <!-- Pack Ice & Snow Shelf -->
  <path d="M 0,360 L 220,340 L 460,370 L 680,345 L 800,365 L 800,500 L 0,500 Z" fill="url(#packIce)" />
  <!-- Icy Crevasse Depth -->
  <polygon points="120,380 200,410 180,500 100,500" fill="#0284c7" opacity="0.3" />

  <!-- Emperor Penguin (Aptenodytes forsteri) -->
  <g transform="translate(400, 160)">
    <!-- Shadow on Snow -->
    <ellipse cx="0" cy="225" rx="75" ry="18" fill="#0369a1" opacity="0.35" />

    <!-- Feet Claws Gripping Ice -->
    <path d="M -35,215 L -45,230 M -30,215 L -32,235 M -25,215 L -20,232" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
    <path d="M 25,215 L 20,232 M 30,215 L 32,235 M 35,215 L 45,230" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />

    <!-- Tuxedo Black Back Silhouette -->
    <path d="M 0,-40 C -45,-30 -70,20 -70,120 C -70,180 -50,220 0,220 C 50,220 70,180 70,120 C 70,20 45,-30 0,-40 Z" fill="#0f172a" />

    <!-- Pristine White Belly Plumage -->
    <path d="M 0,10 C -35,20 -50,70 -45,150 C -40,200 -25,215 0,215 C 25,215 40,200 45,150 C 50,70 35,20 0,10 Z" fill="#ffffff" />
    
    <!-- Warm Golden Yellow Chest Glow -->
    <ellipse cx="0" cy="35" rx="28" ry="25" fill="#fef08a" opacity="0.8" />
    <ellipse cx="0" cy="25" rx="18" ry="15" fill="#fde047" opacity="0.9" />

    <!-- Stiff Flipper Wings (Left & Right) -->
    <path d="M -60,40 C -95,80 -105,140 -85,160 C -75,150 -70,100 -55,60 Z" fill="#0f172a" />
    <path d="M 60,40 C 95,80 105,140 85,160 C 75,150 70,100 55,60 Z" fill="#0f172a" />

    <!-- Head & Neck -->
    <circle cx="0" cy="-60" r="34" fill="#0f172a" />

    <!-- Golden Orange Auroral Cheek Patches -->
    <ellipse cx="-22" cy="-55" rx="10" ry="16" transform="rotate(-20 -22 -55)" fill="url(#goldenEar)" />
    <ellipse cx="22" cy="-55" rx="10" ry="16" transform="rotate(20 22 -55)" fill="url(#goldenEar)" />

    <!-- Slender Beak with Orange Bill Stripe -->
    <path d="M -5,-62 L -35,-58 L -5,-54 Z" fill="#0f172a" />
    <path d="M -8,-58 L -30,-57" stroke="#fb923c" stroke-width="2.5" />

    <!-- Dark Eye -->
    <circle cx="-10" cy="-65" r="3" fill="#ffffff" />
    <circle cx="-10" cy="-65" r="1.5" fill="#000000" />
  </g>

  <!-- Species Title Banner overlay -->
  <g transform="translate(30, 440)">
    <rect x="0" y="0" width="220" height="38" rx="8" fill="#1e1b4b" fill-opacity="0.85" />
    <text x="14" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Aptenodytes forsteri</text>
  </g>
</svg>

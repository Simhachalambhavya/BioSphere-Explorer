<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="forestFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="60%" stop-color="#052e16" />
      <stop offset="100%" stop-color="#021d0d" />
    </linearGradient>
    <linearGradient id="shroomCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="60%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="stemWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Deep Forest Floor Background -->
  <rect width="800" height="500" fill="url(#forestFloor)" />

  <!-- Moss & Fallen Pine Needles -->
  <path d="M 0,380 C 180,350 320,380 500,360 C 650,340 750,390 800,370 L 800,500 L 0,500 Z" fill="#166534" />
  <path d="M 0,420 C 250,390 480,410 800,390 L 800,500 L 0,500 Z" fill="#0f3d1b" />

  <!-- Fly Agaric Mushroom (Amanita muscaria) -->
  <g transform="translate(400, 220)">
    <!-- Fibrous White Stem (Stipe) with Swollen Base (Volva) -->
    <path d="M -30,180 C -45,180 -55,160 -40,140 C -25,100 -20,20 -15,-30 L 15,-30 C 20,20 25,100 40,140 C 55,160 45,180 30,180 Z" fill="url(#stemWhite)" />

    <!-- Skirt / Annulus Ring Collar -->
    <path d="M -35,30 C -20,45 20,45 35,30 C 45,45 20,60 0,60 C -20,60 -45,45 -35,30 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- White Gills under the Cap -->
    <path d="M -130,-30 C -80,-5 80,-5 130,-30 C 100,-10 -100,-10 -130,-30 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />

    <!-- Scarlet Red Mushroom Cap (Pileus) -->
    <path d="M -150,-30 C -150,-150 -70,-200 0,-200 C 70,-200 150,-150 150,-30 C 100,-10 -100,-10 -150,-30 Z" fill="url(#shroomCap)" />

    <!-- Universal Veil White Warts (Spots) on Cap -->
    <g fill="#ffffff" opacity="0.95">
      <!-- Crown Top Spots -->
      <polygon points="0,-185 -10,-175 0,-165 10,-175" />
      <circle cx="-35" cy="-160" r="10" />
      <circle cx="35" cy="-160" r="10" />
      <polygon points="-65,-130 -78,-120 -65,-110 -52,-120" />
      <circle cx="0" cy="-135" r="12" />
      <polygon points="65,-130 52,-120 65,-110 78,-120" />
      <!-- Lower Tier Spots -->
      <circle cx="-105" cy="-85" r="11" />
      <polygon points="-40,-85 -52,-75 -40,-65 -28,-75" />
      <circle cx="35" cy="-80" r="12" />
      <polygon points="105,-85 92,-75 105,-65 118,-75" />
      <circle cx="-125" cy="-45" r="8" />
      <circle cx="-75" cy="-45" r="9" />
      <circle cx="0" cy="-40" r="10" />
      <circle cx="75" cy="-45" r="9" />
      <circle cx="125" cy="-45" r="8" />
    </g>

    <!-- Baby Button Mushroom at the base -->
    <g transform="translate(110, 120)">
      <path d="M -10,60 L 10,60 L 5,20 L -5,20 Z" fill="#f8fafc" />
      <ellipse cx="0" cy="15" rx="30" ry="25" fill="url(#shroomCap)" />
      <circle cx="-10" cy="8" r="4" fill="#ffffff" />
      <circle cx="10" cy="12" r="4.5" fill="#ffffff" />
      <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
    </g>
  </g>

  <!-- Species Title Banner overlay -->
  <g transform="translate(30, 440)">
    <rect x="0" y="0" width="190" height="38" rx="8" fill="#dc2626" fill-opacity="0.9" />
    <text x="14" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Amanita muscaria</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gardenSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="monarchOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <linearGradient id="leafGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
  </defs>

  <!-- Sunlit Meadow Background -->
  <rect width="800" height="500" fill="url(#gardenSky)" />

  <!-- Out of focus meadow foliage and milkweed buds -->
  <path d="M 0,380 C 120,320 200,420 300,500 L 0,500 Z" fill="#15803d" opacity="0.5" />
  <path d="M 450,420 C 580,330 680,450 800,400 L 800,500 L 450,500 Z" fill="#166534" opacity="0.6" />

  <!-- Pink Milkweed Flower Cluster -->
  <g transform="translate(180, 320)">
    <path d="M 120,180 Q 140,90 160,0" stroke="#15803d" stroke-width="8" fill="none" />
    <!-- Flower Petals -->
    <g fill="#ec4899">
      <ellipse cx="140" cy="-10" rx="10" ry="16" />
      <ellipse cx="160" cy="-25" rx="12" ry="18" />
      <ellipse cx="180" cy="-15" rx="10" ry="15" />
      <ellipse cx="150" cy="10" rx="12" ry="16" />
      <ellipse cx="170" cy="8" rx="11" ry="15" />
    </g>
    <g fill="#f472b6" opacity="0.8">
      <circle cx="150" cy="-10" r="5" />
      <circle cx="165" cy="-12" r="5" />
      <circle cx="160" cy="2" r="5" />
    </g>
  </g>

  <!-- Monarch Butterfly (Danaus plexippus) -->
  <g transform="translate(250, 80)">
    <!-- Left Forewing -->
    <g transform="translate(140, 140) rotate(-15)">
      <path d="M 0,0 C -50,-80 -120,-130 -160,-120 C -200,-110 -220,-30 -150,20 C -90,50 -30,20 0,0 Z" fill="url(#monarchOrange)" stroke="#09090b" stroke-width="8" />
      <!-- Wing Veins -->
      <path d="M 0,0 Q -80,-50 -160,-100 M 0,0 Q -90,-20 -180,-40 M 0,0 Q -70,20 -130,20" stroke="#09090b" stroke-width="4" fill="none" />
      <!-- White Spots on Black Margin -->
      <g fill="#ffffff">
        <circle cx="-185" cy="-80" r="2.5" />
        <circle cx="-195" cy="-55" r="3" />
        <circle cx="-190" cy="-30" r="3" />
        <circle cx="-170" cy="-5" r="2.5" />
        <circle cx="-150" cy="12" r="2.5" />
      </g>
    </g>

    <!-- Right Forewing -->
    <g transform="translate(160, 140) rotate(15)">
      <path d="M 0,0 C 50,-80 120,-130 160,-120 C 200,-110 220,-30 150,20 C 90,50 30,20 0,0 Z" fill="url(#monarchOrange)" stroke="#09090b" stroke-width="8" />
      <!-- Wing Veins -->
      <path d="M 0,0 Q 80,-50 160,-100 M 0,0 Q 90,-20 180,-40 M 0,0 Q 70,20 130,20" stroke="#09090b" stroke-width="4" fill="none" />
      <!-- White Spots on Black Margin -->
      <g fill="#ffffff">
        <circle cx="185" cy="-80" r="2.5" />
        <circle cx="195" cy="-55" r="3" />
        <circle cx="190" cy="-30" r="3" />
        <circle cx="170" cy="-5" r="2.5" />
        <circle cx="150" cy="12" r="2.5" />
      </g>
    </g>

    <!-- Left Hindwing -->
    <g transform="translate(145, 145) rotate(-5)">
      <path d="M 0,0 C -30,30 -70,70 -110,65 C -140,55 -140,0 -80,-10 C -40,-10 -10,0 0,0 Z" fill="url(#monarchOrange)" stroke="#09090b" stroke-width="7" />
      <path d="M 0,0 Q -50,40 -95,45 M 0,0 Q -60,20 -115,25" stroke="#09090b" stroke-width="3" fill="none" />
      <g fill="#ffffff">
        <circle cx="-120" cy="40" r="2" />
        <circle cx="-100" cy="55" r="2" />
        <circle cx="-80" cy="58" r="2" />
      </g>
    </g>

    <!-- Right Hindwing -->
    <g transform="translate(155, 145) rotate(5)">
      <path d="M 0,0 C 30,30 70,70 110,65 C 140,55 140,0 80,-10 C 40,-10 10,0 0,0 Z" fill="url(#monarchOrange)" stroke="#09090b" stroke-width="7" />
      <path d="M 0,0 Q 50,40 95,45 M 0,0 Q 60,20 115,25" stroke="#09090b" stroke-width="3" fill="none" />
      <g fill="#ffffff">
        <circle cx="120" cy="40" r="2" />
        <circle cx="100" cy="55" r="2" />
        <circle cx="80" cy="58" r="2" />
      </g>
    </g>

    <!-- Slender Thorax & Abdomen Body -->
    <ellipse cx="150" cy="140" rx="7" ry="38" fill="#18181b" />
    <circle cx="150" cy="98" r="7" fill="#18181b" />
    <!-- White Body Spots -->
    <g fill="#ffffff" opacity="0.9">
      <circle cx="150" cy="115" r="1.5" />
      <circle cx="150" cy="125" r="1.5" />
      <circle cx="150" cy="135" r="1.5" />
      <circle cx="150" cy="145" r="1.5" />
      <circle cx="150" cy="155" r="1.5" />
    </g>

    <!-- Curved Clubbed Antennae -->
    <path d="M 148,94 Q 130,65 110,60" stroke="#18181b" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="109" cy="60" r="2.5" fill="#18181b" />

    <path d="M 152,94 Q 170,65 190,60" stroke="#18181b" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="191" cy="60" r="2.5" fill="#18181b" />
  </g>

  <!-- Species Title Banner overlay -->
  <g transform="translate(30, 440)">
    <rect x="0" y="0" width="200" height="38" rx="8" fill="#c2410c" fill-opacity="0.9" />
    <text x="14" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Danaus plexippus</text>
  </g>
</svg>

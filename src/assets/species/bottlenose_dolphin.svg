<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dolphinSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="dolphinSea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="dolphinBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="dolphinUnder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Sky & Tropical Sea -->
  <rect width="800" height="280" fill="url(#dolphinSky)" />
  <rect y="260" width="800" height="240" fill="url(#dolphinSea)" />

  <!-- Sea Surface Wave Crests -->
  <path d="M 0,260 Q 50,250 100,260 T 200,260 T 300,260 T 400,260 T 500,260 T 600,260 T 700,260 T 800,260 L 800,290 L 0,290 Z" fill="#0ea5e9" opacity="0.6" />
  
  <!-- Splash Water Spray -->
  <g fill="#ffffff" opacity="0.8">
    <ellipse cx="260" cy="275" rx="35" ry="12" />
    <circle cx="240" cy="255" r="4" />
    <circle cx="270" cy="245" r="3" />
    <circle cx="285" cy="260" r="5" />
    <circle cx="250" cy="240" r="2.5" />
  </g>

  <!-- Leaping Bottlenose Dolphin in Mid-Air Arc -->
  <g transform="translate(180, 70)">
    <!-- Main Arched Body -->
    <path d="M 40,160 C 80,100 180,40 320,50 C 400,60 460,110 500,160 C 460,150 410,130 330,115 C 220,100 100,140 40,160 Z" fill="url(#dolphinBody)" />
    
    <!-- Pale White/Pinkish Belly & Throat -->
    <path d="M 70,165 C 130,135 220,110 320,115 C 280,130 200,150 110,175 C 85,178 70,170 70,165 Z" fill="url(#dolphinUnder)" opacity="0.9" />

    <!-- Distinct Rostrum ("Beak") & Jaw Line -->
    <path d="M 40,160 C 20,165 5,172 0,176 C 10,180 30,182 50,178 C 45,172 40,166 40,160 Z" fill="#475569" />
    
    <!-- Curved Falcate Dorsal Fin -->
    <path d="M 270,55 C 285,15 315,10 325,18 C 315,35 305,52 300,62 Z" fill="#334155" />

    <!-- Pectoral Flipper -->
    <path d="M 170,125 C 190,160 210,185 200,190 C 190,190 175,165 155,135 Z" fill="#334155" />

    <!-- Tail Flukes with Center Notch -->
    <path d="M 495,158 C 520,140 550,125 565,130 C 550,150 530,165 515,168 C 535,175 555,190 565,210 C 545,210 520,195 495,172 Z" fill="#334155" />

    <!-- Intelligent Dark Eye & Smile -->
    <circle cx="95" cy="150" r="3.5" fill="#0f172a" />
    <path d="M 25,176 Q 50,172 75,165" stroke="#334155" stroke-width="1.5" fill="none" />
  </g>

  <!-- Species Title Banner overlay -->
  <g transform="translate(30, 440)">
    <rect x="0" y="0" width="200" height="38" rx="8" fill="#0369a1" fill-opacity="0.8" />
    <text x="14" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Tursiops truncatus</text>
  </g>
</svg>

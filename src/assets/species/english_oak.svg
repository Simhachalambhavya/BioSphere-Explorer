<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="oakSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <linearGradient id="canopyGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="40%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="trunkBark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#3b1d0b" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#oakSky)" />

  <!-- Rolling Meadow Grassland -->
  <path d="M 0,380 Q 200,360 400,380 T 800,370 L 800,500 L 0,500 Z" fill="#15803d" />
  <path d="M 0,410 Q 300,390 600,420 T 800,410 L 800,500 L 0,500 Z" fill="#166534" opacity="0.6" />

  <!-- Giant Venerable English Oak (Quercus robur) -->
  <g transform="translate(400, 240)">
    <!-- Broad Buttress Roots -->
    <path d="M -55,160 Q -90,180 -120,180 M 55,160 Q 90,180 120,180" stroke="#451a03" stroke-width="18" stroke-linecap="round" fill="none" />

    <!-- Massive Gnarled Trunk -->
    <path d="M -50,165 C -45,80 -70,20 -110,-40 M 50,165 C 45,80 70,20 110,-40" stroke="url(#trunkBark)" stroke-width="70" stroke-linecap="round" fill="none" />
    
    <!-- Heavy Sprawling Branches -->
    <path d="M -60,20 Q -140,-30 -220,-20 M 60,20 Q 140,-30 220,-20 M -30,-20 Q -90,-90 -160,-130 M 30,-20 Q 90,-90 160,-130 M 0,-40 L 0,-140" stroke="#78350f" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Voluminous Lush Green Canopy Masses -->
    <g fill="url(#canopyGreen)">
      <circle cx="-160" cy="-60" r="100" />
      <circle cx="160" cy="-60" r="100" />
      <circle cx="-200" cy="-10" r="85" />
      <circle cx="200" cy="-10" r="85" />
      <circle cx="-90" cy="-140" r="95" />
      <circle cx="90" cy="-140" r="95" />
      <circle cx="0" cy="-160" r="110" />
      <circle cx="0" cy="-90" r="120" />
    </g>

    <!-- Foreground Sunlight Leaves Highlights -->
    <g fill="#86efac" opacity="0.4">
      <circle cx="-60" cy="-180" r="50" />
      <circle cx="40" cy="-190" r="45" />
      <circle cx="120" cy="-100" r="40" />
      <circle cx="-130" cy="-90" r="45" />
    </g>

    <!-- Acorn Inset Cluster on bottom right -->
    <g transform="translate(180, 110)">
      <rect x="0" y="0" width="130" height="75" rx="10" fill="#0f172a" fill-opacity="0.8" />
      <!-- Acorn Cap & Nut -->
      <path d="M 45,35 C 45,22 65,22 65,35 Z" fill="#92400e" />
      <path d="M 47,35 C 47,55 55,60 55,60 C 55,60 63,55 63,35 Z" fill="#d97706" />
      <path d="M 55,22 L 55,16" stroke="#78350f" stroke-width="2" />
      <text x="75" y="44" fill="#fef08a" font-family="sans-serif" font-weight="700" font-size="12">Oak</text>
      <text x="75" y="58" fill="#e2e8f0" font-family="sans-serif" font-size="10">Acorns</text>
    </g>
  </g>

  <!-- Species Title Banner overlay -->
  <g transform="translate(30, 440)">
    <rect x="0" y="0" width="180" height="38" rx="8" fill="#14532d" fill-opacity="0.9" />
    <text x="14" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Quercus robur</text>
  </g>
</svg>

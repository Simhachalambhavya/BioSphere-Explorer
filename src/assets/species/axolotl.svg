<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="lakeWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
    <linearGradient id="axolotlSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3" />
      <stop offset="50%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="gillFeather" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
  </defs>

  <!-- Lake Xochimilco Freshwater Habitat -->
  <rect width="800" height="500" fill="url(#lakeWater)" />

  <!-- Aquatic Plants & Water Bubbles -->
  <path d="M 60,500 Q 80,350 40,200 Q 10,120 70,50" stroke="#059669" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M 720,500 Q 690,380 750,250 Q 770,180 730,80" stroke="#059669" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.6" />
  <circle cx="200" cy="180" r="6" fill="#a7f3d0" opacity="0.4" />
  <circle cx="215" cy="150" r="4" fill="#a7f3d0" opacity="0.4" />
  <circle cx="580" cy="220" r="5" fill="#a7f3d0" opacity="0.4" />

  <!-- Axolotl (Ambystoma mexicanum) -->
  <g transform="translate(360, 230)">
    <!-- Undulating Tail & Dorsal Fin Ribbon -->
    <path d="M -60,0 C -140,-10 -200,30 -260,20 C -290,15 -310,-10 -330,0 C -300,30 -250,60 -180,40 C -120,25 -70,20 -60,0 Z" fill="#fbcfe8" opacity="0.75" />
    <!-- Tail Spine Body Line -->
    <path d="M -60,5 Q -160,10 -280,10" stroke="#f472b6" stroke-width="14" stroke-linecap="round" fill="none" />

    <!-- Cute Chubby Head -->
    <ellipse cx="60" cy="0" rx="90" ry="70" fill="url(#axolotlSkin)" />

    <!-- 6 External Feathery Gills (3 Left, 3 Right) -->
    <!-- Left Branch 1 -->
    <g transform="translate(25, -50) rotate(-40)">
      <path d="M 0,0 Q 10,-45 5,-80" stroke="url(#gillFeather)" stroke-width="6" fill="none" stroke-linecap="round" />
      <path d="M 0,-20 L -12,-30 M 2,-35 L -10,-45 M 4,-50 L -8,-60 M 3,-65 L -7,-75" stroke="#fb7185" stroke-width="3" stroke-linecap="round" />
      <path d="M 1,-20 L 14,-28 M 3,-35 L 16,-43 M 5,-50 L 17,-58" stroke="#fb7185" stroke-width="3" stroke-linecap="round" />
    </g>
    <!-- Left Branch 2 -->
    <g transform="translate(10, -20) rotate(-70)">
      <path d="M 0,0 Q 10,-45 5,-80" stroke="url(#gillFeather)" stroke-width="6" fill="none" stroke-linecap="round" />
      <path d="M 0,-20 L -12,-30 M 2,-35 L -10,-45 M 4,-50 L -8,-60" stroke="#fb7185" stroke-width="3" stroke-linecap="round" />
      <path d="M 1,-20 L 14,-28 M 3,-35 L 16,-43 M 5,-50 L 17,-58" stroke="#fb7185" stroke-width="3" stroke-linecap="round" />
    </g>
    <!-- Left Branch 3 -->
    <g transform="translate(5, 10) rotate(-100)">
      <path d="M 0,0 Q 10,-40 5,-70" stroke="url(#gillFeather)" stroke-width="5" fill="none" stroke-linecap="round" />
      <path d="M 0,-18 L -10,-26 M 2,-32 L -8,-40" stroke="#fb7185" stroke-width="3" stroke-linecap="round" />
      <path d="M 1,-18 L 12,-24 M 3,-32 L 14,-38" stroke="#fb7185" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Right Branch 1 -->
    <g transform="translate(85, -50) rotate(40)">
      <path d="M 0,0 Q -10,-45 -5,-80" stroke="url(#gillFeather)" stroke-width="6" fill="none" stroke-linecap="round" />
      <path d="M 0,-20 L 12,-30 M -2,-35 L 10,-45 M -4,-50 L 8,-60 M -3,-65 L 7,-75" stroke="#fb7185" stroke-width="3" stroke-linecap="round" />
      <path d="M -1,-20 L -14,-28 M -3,-35 L -16,-43 M -5,-50 L -17,-58" stroke="#fb7185" stroke-width="3" stroke-linecap="round" />
    </g>
    <!-- Right Branch 2 -->
    <g transform="translate(100, -20) rotate(70)">
      <path d="M 0,0 Q -10,-45 -5,-80" stroke="url(#gillFeather)" stroke-width="6" fill="none" stroke-linecap="round" />
      <path d="M 0,-20 L 12,-30 M -2,-35 L 10,-45 M -4,-50 L 8,-60" stroke="#fb7185" stroke-width="3" stroke-linecap="round" />
      <path d="M -1,-20 L -14,-28 M -3,-35 L -16,-43 M -5,-50 L -17,-58" stroke="#fb7185" stroke-width="3" stroke-linecap="round" />
    </g>
    <!-- Right Branch 3 -->
    <g transform="translate(105, 10) rotate(100)">
      <path d="M 0,0 Q -10,-40 -5,-70" stroke="url(#gillFeather)" stroke-width="5" fill="none" stroke-linecap="round" />
      <path d="M 0,-18 L 10,-26 M -2,-32 L 8,-40" stroke="#fb7185" stroke-width="3" stroke-linecap="round" />
      <path d="M -1,-18 L -12,-24 M -3,-32 L -14,-38" stroke="#fb7185" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Eyes (Tiny Beady Black Eyes) -->
    <circle cx="30" cy="-15" r="5" fill="#0f172a" />
    <circle cx="31" cy="-17" r="1.5" fill="#ffffff" />

    <circle cx="90" cy="-15" r="5" fill="#0f172a" />
    <circle cx="91" cy="-17" r="1.5" fill="#ffffff" />

    <!-- Gentle Smiling Mouth -->
    <path d="M 35,25 Q 60,42 85,25" stroke="#db2777" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Cute Front Limbs (4 Digits) -->
    <g transform="translate(15, 60)">
      <path d="M 0,0 L -15,30 M -15,30 L -25,40 M -15,30 L -18,44 M -15,30 L -10,44 M -15,30 L -3,40" stroke="#f472b6" stroke-width="4" stroke-linecap="round" fill="none" />
    </g>
    <g transform="translate(85, 60)">
      <path d="M 0,0 L 15,30 M 15,30 L 25,40 M 15,30 L 18,44 M 15,30 L 10,44 M 15,30 L 3,40" stroke="#f472b6" stroke-width="4" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- Species Title Banner overlay -->
  <g transform="translate(30, 440)">
    <rect x="0" y="0" width="220" height="38" rx="8" fill="#be123c" fill-opacity="0.85" />
    <text x="14" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Ambystoma mexicanum</text>
  </g>
</svg>

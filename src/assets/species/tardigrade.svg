<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="microDarkfield" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="60%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#02140e" />
    </radialGradient>
    <linearGradient id="tardigradeSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="40%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
  </defs>

  <!-- Microscope Field of View -->
  <rect width="800" height="500" fill="url(#microDarkfield)" />

  <!-- Lens Vignette Circle & Reticle Scale -->
  <circle cx="400" cy="250" r="230" stroke="#0f766e" stroke-width="3" fill="none" opacity="0.4" />
  <g stroke="#0f766e" stroke-width="1" opacity="0.3">
    <line x1="400" y1="20" x2="400" y2="480" />
    <line x1="170" y1="250" x2="630" y2="250" />
  </g>

  <!-- Floating Microscopic Particles / Algae Spores -->
  <g fill="#2dd4bf" opacity="0.3">
    <circle cx="220" cy="120" r="4" />
    <circle cx="580" cy="110" r="5" />
    <circle cx="620" cy="380" r="3" />
    <circle cx="250" cy="390" r="6" />
    <circle cx="340" cy="80" r="3" />
    <circle cx="460" cy="420" r="4" />
  </g>

  <!-- Tardigrade (Hypsibius exemplaris) -->
  <g transform="translate(380, 230)">
    <!-- 8 Plump Stubby Legs (4 Pairs with Claws) -->
    <!-- Pair 4 (Rear legs with claws) -->
    <path d="M -140,40 C -180,60 -210,80 -230,100" stroke="#0d9488" stroke-width="26" stroke-linecap="round" fill="none" />
    <g stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round">
      <line x1="-230" y1="100" x2="-245" y2="110" />
      <line x1="-230" y1="100" x2="-238" y2="118" />
      <line x1="-230" y1="100" x2="-226" y2="120" />
      <line x1="-230" y1="100" x2="-216" y2="116" />
    </g>

    <!-- Pair 3 -->
    <path d="M -60,50 C -70,90 -90,130 -110,150" stroke="#0d9488" stroke-width="28" stroke-linecap="round" fill="none" />
    <g stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round">
      <line x1="-110" y1="150" x2="-125" y2="165" />
      <line x1="-110" y1="150" x2="-112" y2="170" />
      <line x1="-110" y1="150" x2="-98" y2="168" />
      <line x1="-110" y1="150" x2="-90" y2="160" />
    </g>

    <!-- Pair 2 -->
    <path d="M 20,50 C 15,90 0,130 -15,155" stroke="#0d9488" stroke-width="28" stroke-linecap="round" fill="none" />
    <g stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round">
      <line x1="-15" y1="155" x2="-30" y2="170" />
      <line x1="-15" y1="155" x2="-18" y2="175" />
      <line x1="-15" y1="155" x2="-3" y2="172" />
      <line x1="-15" y1="155" x2="8" y2="165" />
    </g>

    <!-- Pair 1 (Front legs) -->
    <path d="M 90,45 C 95,85 90,120 80,145" stroke="#0d9488" stroke-width="26" stroke-linecap="round" fill="none" />
    <g stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round">
      <line x1="80" y1="145" x2="68" y2="162" />
      <line x1="80" y1="145" x2="80" y2="167" />
      <line x1="80" y1="145" x2="94" y2="165" />
      <line x1="80" y1="145" x2="102" y2="157" />
    </g>

    <!-- Segmented Plump Barrel Body (4 Segments) -->
    <path d="M -160,20 C -140,-40 -50,-50 40,-40 C 110,-30 160,0 160,30 C 150,70 100,75 20,70 C -70,65 -140,55 -160,20 Z" fill="url(#tardigradeSkin)" />
    
    <!-- Cuticle Segment Folds -->
    <path d="M -90,-42 Q -80,10 -90,62" stroke="#0f766e" stroke-width="3" fill="none" />
    <path d="M -10,-46 Q 0,10 -10,68" stroke="#0f766e" stroke-width="3" fill="none" />
    <path d="M 70,-38 Q 80,10 70,66" stroke="#0f766e" stroke-width="3" fill="none" />

    <!-- Head & Tubular Snout with Internal Stylets -->
    <circle cx="160" cy="20" r="38" fill="url(#tardigradeSkin)" />
    <ellipse cx="195" cy="20" rx="14" ry="12" fill="#2dd4bf" stroke="#0f766e" stroke-width="2" />
    <circle cx="198" cy="20" r="4" fill="#042f2e" />

    <!-- Simple Eye Spots (Pigment-Cup Ocelli) -->
    <circle cx="170" cy="6" r="3.5" fill="#042f2e" />
  </g>

  <!-- Species Title Banner overlay -->
  <g transform="translate(30, 440)">
    <rect x="0" y="0" width="220" height="38" rx="8" fill="#0f766e" fill-opacity="0.85" />
    <text x="14" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Hypsibius exemplaris</text>
  </g>
</svg>

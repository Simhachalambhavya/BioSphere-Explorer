<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="warmMeadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="beeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="beeWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <!-- Macro Floral Background -->
  <rect width="800" height="500" fill="url(#warmMeadow)" />

  <!-- Lavender / Purple Flower Petals (Macro Blurred) -->
  <g fill="#7c3aed" opacity="0.6">
    <ellipse cx="250" cy="420" rx="90" ry="180" transform="rotate(-30 250 420)" />
    <ellipse cx="400" cy="460" rx="90" ry="180" transform="rotate(10 400 460)" />
    <ellipse cx="550" cy="430" rx="90" ry="180" transform="rotate(40 550 430)" />
  </g>

  <!-- Western Honey Bee (Apis mellifera) -->
  <g transform="translate(380, 210) rotate(-10)">
    <!-- Translucent Wings (Forewing & Hindwing) -->
    <!-- Left Forewing -->
    <path d="M -30,-40 C -80,-140 -160,-170 -190,-140 C -210,-110 -150,-40 -50,-20 Z" fill="url(#beeWing)" stroke="#e2e8f0" stroke-width="2" />
    <path d="M -40,-35 Q -120,-100 -170,-130 M -60,-35 Q -130,-70 -160,-80" stroke="#cbd5e1" stroke-width="1.5" fill="none" opacity="0.7" />

    <!-- Right Forewing -->
    <path d="M 10,-50 C 40,-160 120,-180 150,-150 C 170,-120 110,-50 20,-30 Z" fill="url(#beeWing)" stroke="#e2e8f0" stroke-width="2" />
    <path d="M 15,-45 Q 80,-110 130,-140 M 15,-40 Q 80,-75 110,-85" stroke="#cbd5e1" stroke-width="1.5" fill="none" opacity="0.7" />

    <!-- Fuzzy Thorax (Chest) -->
    <ellipse cx="-20" cy="-10" rx="42" ry="38" fill="#78350f" stroke="#d97706" stroke-width="4" />
    <!-- Furry Thorax Highlights -->
    <circle cx="-25" cy="-15" r="30" fill="#b45309" opacity="0.8" />

    <!-- Striped Abdomen -->
    <g transform="translate(-100, 30) rotate(-25)">
      <!-- Base Amber Oval -->
      <ellipse cx="0" cy="0" rx="65" ry="40" fill="url(#beeGold)" />
      <!-- Black Velvet Stripes -->
      <path d="M -35,-32 Q -30,0 -35,32 L -20,36 Q -15,0 -20,-36 Z" fill="#18181b" />
      <path d="M -5,-39 Q 0,0 -5,39 L 10,38 Q 15,0 10,-38 Z" fill="#18181b" />
      <path d="M 25,-34 Q 30,0 25,34 L 40,30 Q 45,0 40,-30 Z" fill="#18181b" />
      <!-- Sharp Stinger Tip -->
      <polygon points="-65,0 -78,-3 -78,3" fill="#18181b" />
    </g>

    <!-- Head and Compound Eye -->
    <ellipse cx="35" cy="-15" rx="26" ry="24" fill="#292524" />
    <ellipse cx="42" cy="-20" rx="14" ry="18" fill="#1c1917" stroke="#44403c" stroke-width="2" />
    
    <!-- Chemosensory Antennae -->
    <path d="M 50,-25 Q 70,-45 90,-40" stroke="#1c1917" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 50,-15 Q 75,-25 95,-15" stroke="#1c1917" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Legs & Pollen Basket (Corbicula) packed with golden pollen -->
    <!-- Front Leg -->
    <path d="M 20,15 L 40,55 L 60,65" stroke="#292524" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Middle Leg -->
    <path d="M -10,25 L -5,75 L 15,95" stroke="#292524" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Hind Leg with Bright Yellow Pollen Basket -->
    <path d="M -50,30 L -65,85 L -45,115" stroke="#292524" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Pollen Pellet Pack -->
    <ellipse cx="-60" cy="80" rx="12" ry="16" fill="#facc15" stroke="#eab308" stroke-width="2" />
  </g>

  <!-- Species Title Banner overlay -->
  <g transform="translate(30, 440)">
    <rect x="0" y="0" width="180" height="38" rx="8" fill="#d97706" fill-opacity="0.9" />
    <text x="14" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Apis mellifera</text>
  </g>
</svg>
